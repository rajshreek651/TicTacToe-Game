<body>

            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
    </div>
    <button class="refresh" id="reset">Reset Game</button>
    <script src="ttt.js"></script>
</body>
</html>
